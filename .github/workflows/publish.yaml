name: Node.js CI

on:
  workflow_dispatch:
    inputs:
      skip_publish:
        description: 'Skip publishing to the Marketplace'
        required: false
        type: boolean
        default: true

  push:
    branches:
      - main
    paths:
      - "extension.js"
      - "lib/**"
      - ".resources/**"
      - "webpack.config.js"
      - "package.json"
      - "package-lock.json"

  pull_request:
    branches:
      - main
    paths:
      - "extension.js"
      - "lib/**"
      - ".resources/**"
      - "webpack.config.js"
      - "package.json"
      - "package-lock.json"

env:
  PUBLISHER: LemurDaniel
  PAT: ${{ secrets.PUBLISH_PAT }}

jobs:
  build:
    # automated_ branches (securityCheck) verify lint, tests and build themselves
    if: ${{ !contains(github.head_ref, 'automated_') }}

    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      # Push to main always publishes, manual dispatch only with skip_publish=false
      PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.skip_publish == false)) }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - run: npm ci

      - run: npm run lint

      - run: npm run test:unit

      - name: Package extension
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx --yes @vscode/vsce package --out "devopsscripts-$VERSION.vsix"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: env.PUBLISH != 'true'
        with:
          name: Upload Extension package
          path: |
            ./*.vsix

      - name: Publish extension
        if: env.PUBLISH == 'true'
        run: npx --yes @vscode/vsce publish --packagePath "devopsscripts-${{ steps.package.outputs.version }}.vsix" --pat ${{ env.PAT }}
