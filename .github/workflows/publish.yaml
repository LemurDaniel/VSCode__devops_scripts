name: Node.js CI

on: workflow_dispatch

env:
  PUBLISHER: LemurDaniel
  PAT: ${{ secrets.PUBLISH_PAT }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - run: npm ci

      - run: npm run lint

      - run: npm run test:unit

      - name: Package extension
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx --yes @vscode/vsce package --out "devopsscripts-$VERSION.vsix"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish extension
        run: npx --yes @vscode/vsce publish --packagePath "devopsscripts-${{ steps.package.outputs.version }}.vsix" --pat ${{ env.PAT }}

      - name: Extract release notes from CHANGELOG
        run: |
          awk -v h="## [${{ steps.package.outputs.version }}]" '
            index($0, h) == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.package.outputs.version }}" \
            "devopsscripts-${{ steps.package.outputs.version }}.vsix" \
            --title "v${{ steps.package.outputs.version }}" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}"
