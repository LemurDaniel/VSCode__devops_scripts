name: Security Audit

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    name: npm audit fix

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: |
          npm ci

      - name: Audit and fix (including breaking changes)
        id: audit
        shell: pwsh
        run: |
          $before = (npm audit --json | ConvertFrom-Json).metadata.vulnerabilities
          npm audit fix --force
          $after = (npm audit --json | ConvertFrom-Json).metadata.vulnerabilities

          $rows = 'critical', 'high', 'moderate', 'low', 'total' | ForEach-Object { "| $_ | $($before.$_) | $($after.$_) |" }
          "| Severity | Before | After |", "|---|---|---|", $rows, "" | Tee-Object "$env:RUNNER_TEMP/pr-body.md" -Append | Out-File $env:GITHUB_STEP_SUMMARY -Append

          $changed = [bool](git status --porcelain -- package-lock.json package.json)
          "changed=$($changed.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Detect breaking changes
        id: breaking
        if: steps.audit.outputs.changed == 'true'
        shell: pwsh
        run: |
          # Major of a semver range, 0.x counts minor as major
          function Get-Major([string] $range) {
            if ($range -match '(\d+)(?:\.(\d+))?') { ($Matches[1] -eq '0') ? "0.$($Matches[2])" : $Matches[1] }
          }

          $old = git show "HEAD:package.json" | ConvertFrom-Json
          $new = Get-Content package.json | ConvertFrom-Json

          $rows = foreach ($type in 'dependencies', 'devDependencies') {
            foreach ($dep in $old.$type.PSObject.Properties) {
              $newRange = $new.$type.($dep.Name)
              if ((Get-Major $dep.Value) -ne (Get-Major $newRange)) {
                "| $($dep.Name) | $($dep.Value) | $($newRange ?? 'removed') |"
              }
            }
          }

          $breaking = [bool]$rows
          "breaking=$($breaking.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($breaking) {
            "### ⚠️ Breaking changes", "| Dependency | Before | After |", "|---|---|---|", $rows, "" | Tee-Object "$env:RUNNER_TEMP/pr-body.md" -Append | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Verify lint, tests and build
        if: steps.audit.outputs.changed == 'true'
        shell: pwsh
        run: |
          npm run lint *> lint.log
          $lint = $LASTEXITCODE
          npm run test:unit *> test.log
          $test = $LASTEXITCODE
          npm run package *> build.log
          $build = $LASTEXITCODE

          "### Checks", "- lint: $(($lint -eq 0) ? '✅' : '❌')", "- unit tests: $(($test -eq 0) ? '✅' : '❌')", "- build: $(($build -eq 0) ? '✅' : '❌')", "" | Tee-Object "$env:RUNNER_TEMP/pr-body.md" -Append | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "### package.json changes", '```diff', (git diff -- package.json), '```' | Tee-Object "$env:RUNNER_TEMP/pr-body.md" -Append | Out-File $env:GITHUB_STEP_SUMMARY -Append
          Remove-Item lint.log, test.log, build.log
          exit 0

      - name: Bump version and changelog
        if: steps.audit.outputs.changed == 'true'
        shell: pwsh
        run: |
          npm version patch --no-git-tag-version
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $security = "### Security`n`n- Dependency updates via ``npm audit fix --force``.`n`n"

          # An existing [Unreleased] section becomes this version, otherwise insert above the latest release
          $changelog = Get-Content CHANGELOG.md -Raw
          if ($changelog -match '(?m)^## \[Unreleased\]\r?\n\r?\n') {
            $changelog = $changelog.Replace($Matches[0], "## [$version]`n`n$security")
          }
          else {
            $changelog = $changelog.Insert($changelog.IndexOf("`n## [") + 1, "## [$version]`n`n$security")
          }
          Set-Content CHANGELOG.md -Value $changelog -NoNewline
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Create Pull-Request
        if: steps.audit.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BREAKING: ${{ steps.breaking.outputs.breaking }}
        run: |
          # automated_ prefix marks branches created by workflows
          $branch = "automated_security_audit_fix"

          git config --global user.email "landau.daniel.1998@gmail.com"
          git config --global user.name "LemurDaniel"

          git checkout -B $branch
          git add -A
          git commit -m "Security: npm audit fix ($env:VERSION)"
          git push --force --set-upstream origin $branch

          $title = "Security: npm audit fix ($env:VERSION)"
          if (gh pr list --head $branch --state open --json number --jq '.[].number') {
            gh pr edit $branch --title $title --body-file "$env:RUNNER_TEMP/pr-body.md"
          }
          else {
            gh pr create --base main --head $branch --title $title --body-file "$env:RUNNER_TEMP/pr-body.md"
          }

          gh label create breaking-change --color B60205 --description "Major version changes in dependencies" --force
          if ($env:BREAKING -eq 'true') {
            gh pr edit $branch --add-label breaking-change
          }
          else {
            gh pr edit $branch --remove-label breaking-change 2>$null
            exit 0
          }
